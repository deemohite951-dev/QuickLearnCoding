{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4">
                <h3 class="fw-bold mb-3 text-center">Create Your Account</h3>
                <form method="POST" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors.0 }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Sign Up</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Already registered? <a href="{% url 'accounts:login' %}">Log in here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
