{% extends 'base.html' %}

{% block title %}All Courses{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="fw-bold mb-4">Browse Structured 30-Day Roadmaps</h2>
    <div class="row g-4">
        {% for course in courses %}
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ course.title }}</h5>
                    <p class="card-text text-muted flex-grow-1">{{ course.description }}</p>
                    <a href="{% url 'courses:course_detail' course.slug %}" class="btn btn-primary mt-3">View Syllabus</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-muted">No courses are available right now.</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
